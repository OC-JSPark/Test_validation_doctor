services:
  test-db:
    image: pgvector/pgvector:pg16 # pgvector 전용 이미지로 변경
    container_name: local-postgres
    restart : always
    environment:
      POSTGRES_USER: aimieapi
      POSTGRES_PASSWORD: aimieapi
      POSTGRES_DB: aimiedbdevkids01
      TZ: Asia/Seoul
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: